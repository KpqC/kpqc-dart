name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kat-library: build/kat/libkpqc_test.so
          - os: macos-latest
            kat-library: build/kat/libkpqc_test.dylib
          - os: windows-latest
            kat-library: build/kat/Release/kpqc_test.dll
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart build cli --target example/kpqc_example.dart

      - run: cmake -S . -B build/kat -DKPQC_TEST_ENTROPY=ON
      - run: cmake --build build/kat --config Release
      - run: python test/test_kat.py ${{ matrix.kat-library }}

      - if: runner.os == 'Linux'
        run: dart doc
      - if: runner.os == 'Linux'
        run: dart pub publish --dry-run
