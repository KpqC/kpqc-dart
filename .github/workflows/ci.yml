name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  known-answer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: KpqC/kpqc-test-vectors
          ref: d75490bf824faa4b148cd0b901a2eb13198fe0da
          path: kpqc-test-vectors
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Validate portable Dart known-answer vectors
        env:
          KPQC_TEST_VECTORS: ${{ github.workspace }}/kpqc-test-vectors
        run: >-
          dart test
          test/aimer_kat_test.dart
          test/haetae_kat_test.dart
          test/ntruplus_kat_test.dart
          test/smaugt_kat_test.dart

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart doc
      - run: dart pub publish --dry-run
      - run: dart compile js example/kpqc_example.dart -o build/kpqc_example.js

  dart-vm-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart test
      - run: dart build cli --target example/kpqc_example.dart
